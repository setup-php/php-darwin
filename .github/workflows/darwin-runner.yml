name: Ephemeral PHP Darwin runner
run-name: Darwin runner ${{ inputs.pool || 'validation' }}
on:
  push:
    branches: [feature/ephemeral-runner-pool]
    paths: [.github/workflows/darwin-runner.yml, scripts/runners/serve.py]
  workflow_dispatch:
    inputs:
      profile:
        description: Native host for the requested job
        required: true
        type: choice
        options: [intel15, intel26, arm15, arm26]
      pool:
        description: Prepared single-job runner environment
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/runners/serve.py
  runner:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/ephemeral-runner-pool'
    runs-on: ${{ fromJSON('{"intel15":"macos-15-intel","intel26":"macos-26-intel","arm15":"nscloud-macos-sequoia-stable-arm64-4x7","arm26":"nscloud-macos-tahoe-arm64-4x7"}')[inputs.profile] }}
    timeout-minutes: 360
    environment: ${{ inputs.pool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: setup-php/homebrew-php
          ref: ecc8da3b06d691696774d66ed653b8f382bc0881
          path: runner-tools
          sparse-checkout: Scripts
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Serve one job
        env:
          PROFILE: ${{ inputs.profile }}
          POOL: ${{ inputs.pool }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/runner-tools/Scripts
        run: python scripts/runners/serve.py
